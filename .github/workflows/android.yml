name: Android build and device tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '*.py'
      - 'app/**'
      - 'engine/**'
      - 'web/**'
      - 'content/**'
      - 'mobile/android/**'
      - 'tools/android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - '*.py'
      - 'app/**'
      - 'engine/**'
      - 'web/**'
      - 'content/**'
      - 'mobile/android/**'
      - 'tools/android/**'
      - '.github/workflows/android.yml'

permissions:
  contents: read

concurrency:
  group: android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: APK, native ABI checks and Android 36 instrumentation
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Configure test temporary directory
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21.0.13+9'

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tools/android/requirements-host.txt

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false

      - name: Install native build tools
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;29.0.14206865' 'cmake;3.22.1'
          echo "$ANDROID_HOME/cmake/3.22.1/bin" >> "$GITHUB_PATH"

      - name: Set up Gradle cache and validate wrapper
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Install host test dependencies
        run: python3 -m pip install -r tools/android/requirements-host.txt

      - name: Verify original Python engine
        run: >-
          python3 -B -m unittest
          app.tests.test_readable app.tests.test_bridge app.tests.test_setup
          app.tests.test_data_folder app.tests.test_what_ships app.tests.test_update
          app.tests.test_address_search app.tests.test_topic_search app.tests.test_chat_steps
          app.tests.test_chat_tables app.tests.test_validate_topics app.tests.test_libq

      - name: Verify Python engine adapter
        run: python3 -B -m unittest discover -s mobile/android/tests -v

      - name: Verify web route lifecycles and Android branding
        run: node --test app/tests/route_lifecycle_test.mjs app/tests/android_branding_test.mjs

      - name: Restore pinned native build cache
        id: native-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            mobile/ipad/build/deps/llama.cpp
            mobile/android/app/.cxx
            mobile/android/app/build/intermediates/cxx
          key: ${{ runner.os }}-lastphone-native-v1-${{ hashFiles('tools/android/toolchain.lock.json', 'mobile/android/app/build.gradle.kts', 'mobile/android/app/src/main/cpp/CMakeLists.txt', 'mobile/android/app/src/main/cpp/cmake/**') }}-${{ hashFiles('mobile/android/app/src/main/cpp/llama_jni.cpp') }}
          restore-keys: |
            ${{ runner.os }}-lastphone-native-v1-${{ hashFiles('tools/android/toolchain.lock.json', 'mobile/android/app/build.gradle.kts', 'mobile/android/app/src/main/cpp/CMakeLists.txt', 'mobile/android/app/src/main/cpp/cmake/**') }}-

      - name: Prepare pinned native sources
        run: bash mobile/ipad/scripts/prepare_dependencies.sh

      - name: Download and verify native fixtures
        run: python3 tools/android/fetch_test_fixtures.py

      - name: Generate library integration fixture
        run: python3 tools/android/make_fixture.py

      - name: Build APKs and run static checks
        working-directory: mobile/android
        run: >-
          ./gradlew --no-daemon --max-workers=2
          assemblePhoneDebug assembleEmulatorDebug assembleEmulatorDebugAndroidTest
          lintPhoneDebug lintEmulatorDebug testPhoneDebugUnitTest testEmulatorDebugUnitTest

      - name: Preserve native compilation for follow-up fixes
        if: always() && !cancelled() && github.event_name != 'pull_request' && steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            mobile/ipad/build/deps/llama.cpp
            mobile/android/app/.cxx
            mobile/android/app/build/intermediates/cxx
          key: ${{ steps.native-cache.outputs.cache-primary-key }}

      - name: Verify ARM64 APK signature and all 16 KB ELF alignments
        run: >-
          python3 tools/android/verify_apk.py
          mobile/android/app/build/outputs/apk/phone/debug/app-phone-debug.apk
          --abis arm64-v8a
          --report mobile/android/app/build/reports/apk-arm64-verification.json

      - name: Verify separate x86_64 emulator APK
        run: >-
          python3 tools/android/verify_apk.py
          mobile/android/app/build/outputs/apk/emulator/debug/app-emulator-debug.apk
          --abis x86_64 --minimum-load-alignment 4096
          --report mobile/android/app/build/reports/apk-emulator-verification.json

      - name: Require hardware virtualization
        run: |
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm

      - name: Run real Android instrumentation
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          cores: 2
          ram-size: 3072M
          # Use the supported Mesa/ANGLE renderer. Two legacy SwiftShader GLES
          # runs lost the host emulator when opening WebView video, without OOM.
          # Lavapipe still exposes Vulkan, so native GPU inference remains tested.
          emulator-options: -no-window -gpu lavapipe -no-snapshot -noaudio -no-boot-anim
          disable-linux-hw-accel: false
          emulator-boot-timeout: 600
          working-directory: mobile/android
          script: bash ../../tools/android/run_emulator_tests.sh

      - name: Hash installable APK
        working-directory: mobile/android/app/build/outputs/apk/phone/debug
        run: sha256sum app-phone-debug.apk > app-phone-debug.apk.sha256

      - name: Upload tested debug APK
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: lastphone-arm64-debug-tested
          path: |
            mobile/android/app/build/outputs/apk/phone/debug/app-phone-debug.apk
            mobile/android/app/build/outputs/apk/phone/debug/app-phone-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: android-verification-reports
          path: |
            mobile/android/app/build/reports/
            mobile/android/app/build/outputs/androidTest-results/
            mobile/android/app/build/test-results/
          if-no-files-found: warn
          retention-days: 14
